<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
	<head>
		<meta charset="UTF-8" />
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
		<style>
			body {
				background: #2f3b52;
			}
			#app {
				padding: 10px;
			}
			.contests, .juries, .teams {
				border: 1px solid white;
				border-radius: 10px;
				padding: 5px;
			}
		</style>
	</head>
	<body>
		<div id="app">
			<div v-if="isLoaded">
				<div class="d-flex gap-3">
					<div class="dropdown">
						<button type="button" class="btn btn-light dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false" data-bs-auto-close="outside">
							Импортировать JSON
						</button>
						<div class="dropdown-menu p-2">
							<div class="mb-3">
								<label for="" class="form-label">JSON строка</label>
								<input type="text" class="form-control" id="" placeholder="" v-model="importText">
							</div>

							<button class="btn btn-info" @click="importFromInput()">
								<i class="bi bi-download"></i> 
								Подгрузить данные из строки
							</button>
						</div>
					</div>
					<button type="button" class="btn btn-danger" @click="clearDatabase" title="Очистить базу"><i class="bi bi-x-circle"></i></button>
				</div>	
				
				<h3 class="mt-3">Общая информация</h3>
				<label for="" class="form-label mt-1">Название игры</label>
				<input type="text" id="" class="form-control" v-model.lazy="vueGeneral.gameTitle" @change="updateGeneral">
				<label for="" class="form-label mt-1">Дата игры</label>
				<input type="date" id="" class="form-control" v-model.lazy="vueGeneral.date" @change="updateGeneral">
				<label for="" class="form-label mt-1">Ведущий игры</label>
				<input type="text" id="" class="form-control" v-model.lazy="vueGeneral.host" @change="updateGeneral">

				<h3 class="mt-3">Конкурсы</h3>
				<div class="contests mt-2" v-for="(contest, index) in vueContests">
					<label for="" class="form-label d-flex justify-content-between"><span>Название конкурса {{ index + 1 }}</span> <i class="bi bi-x-lg" style="cursor: pointer;" @click="removeContest(index)"></i></label>
					<input type="text" id="" class="form-control" v-model.lazy="contest.name" @change="updateContests">
					<label for="" class="form-label mt-1">Максимальное число баллов</label>
					<input type="text" id="" class="form-control" v-model.lazy="contest.max" @change="updateContests">
				</div>
				<button class="btn btn-dark mt-2" @click="addContest"><i class="bi bi-plus"></i> Добавить конкурс</button>

				<h3 class="mt-3">Жюри</h3>
				<div class="juries mt-2" v-for="(jury, index) in vueJuries" :key="jury.id">
					<label for="" class="form-label d-flex justify-content-between"><span>ФИО {{ index + 1 }}</span> <i class="bi bi-x-lg" style="cursor: pointer;" @click="removeJury(index)"></i></label>
					<input type="text" id="" class="form-control" v-model.lazy="jury.name" @change="updateJuries">
					<label for="" class="form-label mt-1">Дополнительная информация на титр</label>
					<input type="text" id="" class="form-control" v-model.lazy="jury.description" @change="updateJuries">
				</div>
				<button class="btn btn-dark mt-2" @click="addJury"><i class="bi bi-plus"></i> Добавить жюри</button>


				<h3 class="mt-3">Команды</h3>
				<div class="teams mt-2" v-for="(team, index) in vueTeams">
					<label for="" class="form-label d-flex justify-content-between"><span>Название команды {{ index + 1 }}</span> <i class="bi bi-x-lg" style="cursor: pointer;" @click="removeTeam(index)"></i></label>
					<input type="text" id="" class="form-control" v-model.lazy="team.name" @change="updateTeams">
					<label for="" class="form-label mt-1">Высшая школа / университет</label>
					<input type="text" id="" class="form-control" v-model.lazy="team.description" @change="updateTeams">
				</div>
				<button class="btn btn-dark mt-2" @click="addTeam"><i class="bi bi-plus"></i> Добавить команду</button>

				<br>
				<br>
				<button class="btn btn-info mt-2" @click="exportToInput"><i class="bi bi-upload"></i> Сформировать и выгрузить данные</button>
				<label for="" class="form-label mt-3">Скопируйте сформированный JSON, чтобы сохранить его и использовать позднее</label>
				<input type="text" id="" class="form-control" v-model="importText">
			</div>
			<div v-else>
				Загрузка базы данных...
			</div>
		</div>
		<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
		<script type="module" src="./kvn-file-dashboard.js"></script>
	</body>
</html>
