<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link
			href="/bundles/kvn-file-upload/shared/vendor/open-sans/open-sans.css"
			rel="stylesheet" />
		<link
			href="/bundles/kvn-file-upload/shared/vendor/bootstrap/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
			crossorigin="anonymous" />
		<link
			rel="stylesheet"
			href="/bundles/kvn-file-upload/shared/vendor/bootstrap-icons/bootstrap-icons.min.css" />
		<link rel="stylesheet" href="main.css" />
		<script type="module" src="./index.js"></script>
	</head>
	<body>
		<div id="app">
			<!-- <button @click="playIn()">play in</button>
			<button @click="playOut()">play out</button> -->
			<transition @enter="onEnter" @leave="onLeave" :css="false">
				<div v-if="scoreboardStatus.isOnAir" class="scoreboard-container">
					<div class="header">
						<div class="logo">
							<img src="logo.png" alt="" />
						</div>
						<div class="game-name">
							<div id="game-name" class="target" style="font-size: 80px">
								{{ scoreboardStatus.gameTitle }}
							</div>
						</div>
					</div>
					<div class="legend">
						<div class="left-legend">
							<p>Место</p>
							<p>Команда</p>
							<!-- <p v-for="contest in vueContests" class="contests">{{ contest.name }}</p> -->
							<p>Баллы</p>
						</div>
						<div class="right-legend">
							<p>Место</p>
							<p>Команда</p>
							<!-- <p v-for="contest in vueContests" class="contests">{{ contest.name }}</p> -->
							<p>Баллы</p>
						</div>
					</div>
					<div class="elements">
						<div
							class="element item"
							v-for="(team, index) in sortedDisplayTeams"
							:id="'team'+team.id"
							:key="team.id"
							:style="{ height: elementHeight }"
							:class="{ 'is-highlighted': highlightedTeams.includes(team.id), 'is-inactive' : team.isInactive}">
							<div :id="'wave' + team.id" class="wave-layer"></div>
							<div class="content-layer">
								<p class="team-rank">{{ index + 1 }}</p>
								<!-- <p> {{ sortedVueTeams.length - vueActiveContest * 2 }} </p> -->
								<p>{{ team.name }}</p>
								<p :id="'teamSum'+team.id" class="score-cell">
									<span v-show="teamAdds[team.id]" :id="'teamAdd'+team.id" class="add-sum">
										+{{ teamAdds[team.id] }}
									</span>

									<span class="main-sum"> {{ animatedSums[team.id] }} </span>
								</p>
							</div>
						</div>
					</div>
				</div>
			</transition>
		</div>

		<!-- <img src="example.jpg" alt="" class="example-image"> -->
		<script src="/bundles/kvn-file-upload/shared/vendor/split-type/index.umd.js"></script>
		<script src="/bundles/kvn-file-upload/shared/vendor/vue/vue.global.prod.js"></script>
		<script
			src="/bundles/kvn-file-upload/shared/vendor/lodash/lodash.min.js"
			integrity="sha512-WFN04846sdKMIP5LKNphMaWzU7YpMyCU245etK3g/2ARYbPK9Ub18eG+ljU96qKRCWh+quCY7yefSmlkQw1ANQ=="
			crossorigin="anonymous"
			referrerpolicy="no-referrer"></script>
		<script src="/bundles/kvn-file-upload/shared/vendor/gsap/gsap.min.js"></script>
	</body>
</html>
