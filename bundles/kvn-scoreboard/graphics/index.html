<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link
			href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
			rel="stylesheet" />
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
			crossorigin="anonymous" />
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
		<link rel="stylesheet" href="main.css" />
		<script type="module" src="./index.js"></script>
	</head>
	<body>
		<div id="app">
			<!-- <button @click="playIn()">play in</button>
			<button @click="playOut()">play out</button> -->
			<transition @enter="onEnter" @leave="onLeave" :css="false">
				<div v-if="scoreboardStatus.isOnAir" class="scoreboard-container">
					<div class="header">
						<div class="logo">
							<img src="logo.png" alt="" />
						</div>
						<div class="game-name">
							<div id="game-name" class="target" style="font-size: 80px">
								{{ scoreboardStatus.gameTitle }}
							</div>
						</div>
					</div>
					<div class="legend">
						<div class="left-legend">
							<p>Место</p>
							<p>Команда</p>
							<!-- <p v-for="contest in vueContests" class="contests">{{ contest.name }}</p> -->
							<p>Баллы</p>
						</div>
						<div class="right-legend">
							<p>Место</p>
							<p>Команда</p>
							<!-- <p v-for="contest in vueContests" class="contests">{{ contest.name }}</p> -->
							<p>Баллы</p>
						</div>
					</div>
					<transition-group tag="div" name="fade" class="elements">
						<div
							class="element item"
							v-for="(team, index) in sortedTeams"
							:id="'team'+team.id"
							class="item"
							:key="team.id"
							:style="{ height: elementHeight }"
							:class="{ 'is-highlighted': highlightedTeams.includes(team.id) }">
							<p>{{ index + 1 }}</p>
							<!-- <p> {{ sortedVueTeams.length - vueActiveContest * 2 }} </p> -->
							<p>{{ team.name }}</p>
							<p :id="'teamSum'+team.id">
								{{ animatedSums[team.id] !== undefined ? animatedSums[team.id] : team.sum }}
							</p>
						</div>
					</transition-group>
				</div>
			</transition>
		</div>

		<!-- <img src="example.jpg" alt="" class="example-image"> -->
		<script src="https://unpkg.com/split-type"></script>
		<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
		<script
			src="https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.21/lodash.min.js"
			integrity="sha512-WFN04846sdKMIP5LKNphMaWzU7YpMyCU245etK3g/2ARYbPK9Ub18eG+ljU96qKRCWh+quCY7yefSmlkQw1ANQ=="
			crossorigin="anonymous"
			referrerpolicy="no-referrer"></script>
		<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
	</body>
</html>
